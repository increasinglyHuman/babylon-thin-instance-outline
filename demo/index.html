<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>babylon-thin-instance-outline — demo</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0d1117; color: #d0d7de; font: 14px/1.4 system-ui, sans-serif; }
      #render { width: 100vw; height: 100vh; display: block; touch-action: none; }
      #hud {
        position: fixed; top: 16px; left: 16px; padding: 12px 16px;
        background: rgba(13, 17, 23, 0.85); border: 1px solid #30363d; border-radius: 6px;
        max-width: 360px; backdrop-filter: blur(6px); pointer-events: none;
      }
      #hud h1 { margin: 0 0 6px 0; font-size: 14px; font-weight: 600; }
      #hud p { margin: 4px 0; }
      kbd {
        background: #21262d; border: 1px solid #30363d; border-radius: 3px;
        padding: 1px 5px; font: 12px/1.2 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="render"></canvas>
    <div id="hud">
      <h1>babylon-thin-instance-outline</h1>
      <p>100 cubes, one thin-instance host. Click a cube to toggle its outline.</p>
      <p>3 instances start outlined (8, 42, 73).</p>
      <p><kbd>R</kbd> clear all  ·  <kbd>A</kbd> outline all</p>
    </div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
